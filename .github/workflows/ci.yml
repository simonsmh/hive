name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Install, lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (packages/core must be built before apps typecheck and test)
        run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  edge-functions:
    name: Edge Functions (Deno) - ${{ matrix.function }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: [okx-collector, jin10-poller, webhook-dispatcher]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Shared core copies are up to date
        run: node scripts/sync-edge-core.mjs --check
      - name: Lint
        working-directory: supabase/functions/${{ matrix.function }}
        run: deno lint
      - name: Type check
        working-directory: supabase/functions/${{ matrix.function }}
        run: deno check index.ts handler.ts store.ts *.test.ts
      - name: Test
        working-directory: supabase/functions/${{ matrix.function }}
        run: deno test

  migrations:
    name: Apply migrations to Supabase Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.066
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply migrations
        run: bash scripts/apply-migrations.sh
      - name: Verify schema
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/verify.sql
